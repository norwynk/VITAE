# Firebase App Hosting: builds from GitHub `main` and redeploys on every push.
# Live mode: real accounts on Firebase Auth, data in Firestore (Johannesburg)
# through the Cloud Functions. The demo is off. Online sales stay closed until
# NEXT_PUBLIC_SALES_ENABLED is "true".
runConfig:
  minInstances: 0
  maxInstances: 4
  cpu: 1
  memoryMiB: 512
  concurrency: 80

env:
  - variable: DATA_MODE
    value: live
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_DATA_MODE
    value: live
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SALES_ENABLED
    value: "false"
    availability: [BUILD, RUNTIME]
  # Public web config (safe to publish; access is controlled by Auth, App Check and the rules).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyD4Cx0yAZEVrnq-7uqd1WSXQMAuVTIHr4c
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: prick-c3c43.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: prick-c3c43
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: prick-c3c43.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "922416529637"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:922416529637:web:b9f3b54b686650e9a0940c
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY
    value: RECAPTCHA_SITE_KEY_PENDING
    availability: [BUILD, RUNTIME]
